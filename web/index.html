<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach vélo — tableau de bord</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <div>
    <h1>Coach vélo</h1>
    <p id="objective" class="muted">Chargement…</p>
  </div>
  <p class="muted small" id="asof"></p>
</header>
<main>
  <section id="kpis" class="kpis" aria-label="Indicateurs"></section>
  <section id="alerts" aria-label="Alertes"></section>

  <section class="card" id="next-race-card">
    <h2>Prochaine course</h2>
    <div id="next-race"></div>
  </section>

  <section class="card">
    <h2 id="load-title">Condition, fatigue et forme</h2>
    <p class="muted small" id="load-note"></p>
    <div id="load-chart" class="chart" role="img" aria-label="Courbes de condition, fatigue et forme"></div>
    <div class="legend" id="load-legend"></div>
  </section>

  <section class="card">
    <h2>Plan</h2>
    <div id="plan"></div>
  </section>

  <section class="card">
    <h2>Calendrier des courses UFOLEP</h2>
    <div id="calendar"></div>
  </section>

  <section class="card">
    <h2>Séances récentes</h2>
    <div id="activities"></div>
  </section>

  <section class="card">
    <h2>Santé et glycémie</h2>
    <div id="health"></div>
  </section>
</main>
<footer class="muted small">Lecture seule · données de ton espace de travail · rien n'est envoyé sur Internet · <span id="foot"></span></footer>
<script src="/app.js"></script>
</body>
</html>
