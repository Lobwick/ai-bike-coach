# Configuration de l'espace de travail ai-cycling-coach
#
# Ce fichier est VERSIONNÉ : défauts partagés. Pour des overrides personnels,
# créez `config/workspace.user.toml` (gitignoré) avec la même structure —
# ses valeurs priment, clé par clé. Une clé présente mais vide gagne.

[language]
# Langue des Markdown persistés (activities/, medical/, nutrition/, planning/, rapports/).
documents = "fr"
# Langue des réponses. "auto" = celle de la requête.
responses = "auto"

[athlete]
# Profil de l'athlète (jamais versionné). Créé par `/coach-setup` depuis
# `templates/Athlete_Profile.template.md`.
profile = "planning/Athlete_Profile.md"
# "metric" | "imperial" — distances, poids, vitesses.
units = "metric"

[agents]
# Agents joignables. Le coach ne délègue qu'à ceux-là.
#   coach-route  — vélo de route (endurance, sorties longues, cyclosportives, montagne)
#   coach-cx     — cyclocross (départs, relances, technique, format course 40-60 min)
#   coach-poids  — perte de poids (déficit, composition corporelle) compatible avec l'entraînement
#   medical      — sommeil, HRV, FC de repos, blessures, gatekeeper de disponibilité
#   nutritionist — macros, ravitaillement sur le vélo, énergie disponible
enabled = ["coach-route", "coach-cx", "coach-poids", "medical", "nutritionist"]

[coaching]
# Voix des coachs → `config/coaching-styles.md`.
style = "bienveillant"      # bienveillant | exigeant | factuel | pedagogue
intensity = "balanced"      # gentle | balanced | strong
verbosity = "standard"      # brief | standard | detailed

[sport]
# Disciplines pratiquées : détermine quels profils `config/sports/<id>.md` sont chargés.
# Valeurs : "route" | "cx" | "poids". Plusieurs possibles.
disciplines = ["route", "cx", "poids"]
# Autres sports programmables en croisé (renforcement, course à pied…).
cross = ["strength"]

[data]
# SOURCE DES DONNÉES : Open Wearables (MCP agrégateur Garmin/Whoop/Apple/Strava…).
# Lecture seule. Les doublons entre sources sont éliminés par `scripts/arc_ow.py dedup`.
source = "openwearables"
# Identifiant Open Wearables de l'athlète (UUID, `get_users`). Vide = le demander au MCP.
ow_user_id = ""
# Priorité des sources quand la même séance existe en plusieurs exemplaires
# (la première gagne ; les champs absents sont complétés par les suivantes).
source_priority = ["garmin", "strava", "apple", "whoop"]
# Résolution de la FC détaillée d'une séance (`get_timeseries heart_rate`). "5min" garde la réponse légère ;
# "1min" est plus fin mais ~5× plus gros (à réserver à une séance courte et intense).
hr_resolution = "5min"

[push]
# DESTINATION DES ENTRAÎNEMENTS : Garmin Connect uniquement (outils `garmin-mcp` d'écriture).
# Aucune donnée n'est LUE depuis Garmin — tout vient d'Open Wearables.
target = "garmin"
# Jamais de push sans « oui » explicite dans la conversation, jamais en headless.
require_confirmation = true

[health]
# Bilan matinal avant toute décision de séance (HRV + FC de repos + sommeil via Open Wearables).
#   "full"    — HRV + FC de repos + durée de sommeil, avant toute décision
#   "minimal" — durée de sommeil seule, en une ligne
#   "off"     — aucun filtrage santé
morning_check = "full"
# Contexte du cycle menstruel — OPT-IN STRICT. "off" | "ow" (get_menstrual_cycles) | "manual".
cycle_tracking = "off"

[glucose]
# Glycémie (CGM) via le MCP Nightscout — LECTURE SEULE, opt-in. Pour un athlète diabétique
# (type 1 sous boucle fermée, etc.) : séances, ravitaillement et bilan tiennent compte de la glycémie.
# Les outils d'ÉCRITURE du serveur (log_treatment, remove_treatment, update_nightscout_profile)
# ne sont JAMAIS appelés. Aucune dose d'insuline, aucune modification de basale ou d'override :
# décision de l'athlète et de son équipe de diabétologie.
enabled = false
source = "nightscout"
# Plage cible (mg/dL) pour le temps dans la cible, et seuils de départ avant une séance
# (repères de consensus, approximations du projet — Riddell et al. 2017).
low_mgdl = 70
high_mgdl = 180
stop_below_mgdl = 70
start_low_mgdl = 90
start_target_low_mgdl = 126
start_target_high_mgdl = 180
start_high_mgdl = 250

[load]
# Modèle de charge d'entraînement (scripts/arc_cycling.py). Constantes de temps en jours.
condition_days = 42
fatigue_days = 7
# Source de la charge par séance, par ordre de précédence :
#   puissance (FTP au profil) > FC (seuil LTHR au profil) > TRIMP (FC max/repos).
# Ouverte aux données Open Wearables : la plupart des séances n'ont PAS de puissance.

[guardrails]
enabled = true
# R1 : rampe de condition (points de charge/jour/semaine) au-delà de laquelle on avertit.
r1_ramp_max_per_week = 8.0
# R2 : hausse de la charge hebdo planifiée vs moyenne des 4 semaines précédentes (%).
r2_weekly_load_increase_max_pct = 15.0
# R3 : nombre max de jours d'intensité (seuil et plus) consécutifs.
r3_consecutive_hard_max = 2
# R4 : fatigue/forme — forme (condition − fatigue) plancher avant d'exiger une séance facile.
r4_form_floor = -30.0
# R5 : qualité après un verdict santé rouge → bloque.
# R6 : perte de poids — vitesse max de perte hebdo (% du poids de corps).
r6_weight_loss_max_pct_per_week = 1.0
# R7 : déficit — pas de déficit > r7_deficit_max_kcal le jour d'une séance clé (seuil+, > 2 h).
r7_deficit_max_kcal = 300
severity_r1_ramp = "warn"
severity_r2_weekly_load_jump = "warn"
severity_r3_consecutive_hard = "warn"
severity_r4_form_floor = "warn"
severity_r5_quality_after_red = "block"
severity_r6_weight_loss_rate = "warn"
severity_r7_deficit_on_key_day = "warn"

[weight_loss]
# Cadre de la perte de poids (coach-poids). Valeurs personnelles → profil de l'athlète.
# Déficit quotidien cible par défaut (kcal) et plancher d'énergie disponible (kcal/kg masse maigre/j).
default_deficit_kcal = 400
energy_availability_floor = 30
# Protéines (g/kg/j) pendant un déficit avec entraînement.
protein_g_per_kg = 1.8
# Perte de poids sous condition médicale (ex. diabète sous insuline) : un déficit modifie les besoins
# en insuline et le risque d'hypoglycémie. Si `medical_clearance_required` est vrai, AUCUN déficit
# n'est planifié (déficit = 0, maintien) tant que `medical_clearance_confirmed` n'est pas passé à vrai
# par l'athlète, après l'accord de son médecin.
medical_clearance_required = false
medical_clearance_confirmed = false

[sync]
# Synchronisation automatique headless (scripts/daily-sync.sh, `claude -p /daily-sync`).
runner = "claude"
times = ["07:15", "20:30"]
lookback_days = 2
git_autocommit = false
