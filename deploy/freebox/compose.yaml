# Site + API MCP du coach sur la Freebox : UN conteneur, UN processus (~27 Mo), derrière le Traefik existant
# (réseau externe `web`, certificats Let's Encrypt `leresolver`).
#   cd ~/ai-bike-coach/deploy/freebox && cp .env.example .env && (remplir .env, chmod 600) && sudo docker compose up -d --build
# Aucun port publié sur l'hôte : tout passe par Traefik. Aucun secret ici : tout est dans .env (jamais versionné).
# Deux ports internes pour deux niveaux d'authentification : 8000 = site (mot de passe Traefik), 8001 = MCP (jeton applicatif).
name: ai-bike-coach

networks:
  web:
    external: true

services:
  coach:
    build: {context: ../.., dockerfile: deploy/freebox/Dockerfile}
    image: ai-bike-coach:latest
    container_name: coach
    restart: unless-stopped
    user: "${COACH_UID:-1000}:${COACH_GID:-1000}"
    environment:
      ARC_LISTEN: "0.0.0.0"
      ARC_ALLOWED_HOSTS: ${COACH_HOST}
      ARC_PROXY_AUTH: "1"          # déclare : le site est protégé par le basicAuth de Traefik — sans cela il refuse de démarrer
      COACH_MCP_TOKEN: ${COACH_MCP_TOKEN}
    volumes:
      - ${DATA_DIR}:/data
      - ${DATA_DIR}/activities:/app/activities
      - ${DATA_DIR}/medical:/app/medical
      - ${DATA_DIR}/nutrition:/app/nutrition
      - ${DATA_DIR}/planning:/app/planning
      - ${DATA_DIR}/rapports:/app/rapports
      - ${DATA_DIR}/resources:/app/resources
      - ${DATA_DIR}/config/workspace.user.toml:/app/config/workspace.user.toml:ro
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    networks: [web]
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      # Site : https://<hôte>/coach/ — mot de passe (basicAuth), redirection /coach → /coach/, préfixe retiré.
      - traefik.http.routers.coach-site.rule=Host(`${COACH_HOST}`) && PathPrefix(`/coach`)
      - traefik.http.routers.coach-site.entrypoints=websecure
      - traefik.http.routers.coach-site.tls.certresolver=leresolver
      - traefik.http.routers.coach-site.service=coach-site
      - traefik.http.routers.coach-site.middlewares=coach-slash,coach-auth,coach-strip
      - traefik.http.middlewares.coach-slash.redirectregex.regex=^(https?://[^/]+)/coach$$
      - traefik.http.middlewares.coach-slash.redirectregex.replacement=$${1}/coach/
      - traefik.http.middlewares.coach-slash.redirectregex.permanent=true
      - traefik.http.middlewares.coach-auth.basicauth.users=${COACH_BASIC_AUTH}
      - traefik.http.middlewares.coach-auth.basicauth.removeheader=true
      - traefik.http.middlewares.coach-strip.stripprefix.prefixes=/coach
      - traefik.http.services.coach-site.loadbalancer.server.port=8000
      # MCP : https://<hôte>/mcp-coach/mcp — jeton exigé par l'application (en-tête X-Api-Key), même schéma que mcp-wearables.
      # Pas de basicAuth ici ; ce routeur n'atteint QUE le port 8001, qui ne sert jamais le site.
      - traefik.http.routers.coach-mcp.rule=Host(`${COACH_HOST}`) && PathPrefix(`/mcp-coach`)
      - traefik.http.routers.coach-mcp.entrypoints=websecure
      - traefik.http.routers.coach-mcp.tls.certresolver=leresolver
      - traefik.http.routers.coach-mcp.service=coach-mcp
      - traefik.http.routers.coach-mcp.middlewares=coach-mcp-strip
      - traefik.http.middlewares.coach-mcp-strip.stripprefix.prefixes=/mcp-coach
      - traefik.http.services.coach-mcp.loadbalancer.server.port=8001
